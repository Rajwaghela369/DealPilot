services:
  postgres:
    # Stock Postgres 16 plus the pgvector extension binaries -- the plain
    # postgres:16 image cannot CREATE EXTENSION vector, which the
    # document_chunks.embedding column depends on. Same upstream server, so
    # the data volume format is unchanged.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # These ${VAR} substitutions are filled from the root .env (copy from
    # .env.example) -- docker compose auto-loads that file since it sits
    # next to this one. Separate from backend/.env, which the FastAPI app
    # itself reads at runtime.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealpilot}
      POSTGRES_DB: ${POSTGRES_DB:-dealpilot}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - dealpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ so compose passes a literal $ to the container shell, where
      # POSTGRES_USER/POSTGRES_DB are already set by the postgres image.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web UI for inspecting the database -- browse tables, run queries, and
  # see exactly which migration is applied via the `alembic_version` table
  # (Alembic itself only tracks this as a single row, with no UI of its own).
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dealpilot.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_HOST_PORT:-5051}:80"
    volumes:
      - dealpilot_pgadmin_data:/var/lib/pgadmin
      # Pre-registers the DealPilot Postgres connection so it shows up
      # automatically on first login instead of being added by hand.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Object storage for uploaded documents. A document row in Postgres only
  # exists once its bytes are here, so the two must come up together.
  #
  # chainguard/minio, NOT minio/minio: MinIO archived its community edition
  # (repo archived Feb 2026) and removed the images from Docker Hub around
  # Oct 2025. The quay.io mirror that was the usual workaround is now denied
  # too -- both were verified failing. Chainguard publishes an AGPLv3 build
  # that is a drop-in: the backend speaks the S3 API, so any S3-compatible
  # server works if this one ever becomes unavailable (Garage and SeaweedFS
  # are the usual alternatives).
  #
  # The image is distroless -- no shell, no `mc` -- so there is no healthcheck
  # and no bucket-init sidecar. services/storage.py creates the bucket on
  # first use instead, which also means a fresh volume needs no manual step.
  minio:
    image: chainguard/minio:latest
    restart: unless-stopped
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dealpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      # Published because presigned preview URLs are opened by the *browser*,
      # not by the backend -- see MINIO_PUBLIC_ENDPOINT in backend/.env.
      - "${MINIO_API_PORT:-9000}:9000"
    volumes:
      - dealpilot_minio_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Overrides backend/.env's DATABASE_URL (which points at localhost for
      # running uvicorn on the host) so the containerized backend reaches
      # Postgres by its compose service name instead.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dealpilot}:${POSTGRES_PASSWORD:-dealpilot}@postgres:5432/${POSTGRES_DB:-dealpilot}
      # Inside the compose network the backend reaches MinIO by service name.
      # MINIO_PUBLIC_ENDPOINT stays as backend/.env sets it -- presigned URLs
      # are signed for the host the *browser* will use.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dealpilot}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-dealpilot-documents}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # Same image as the backend -- the worker imports the same app package, so a
  # separate Dockerfile would be a second copy of one dependency set. Phase 10
  # adds two more poll queries to this one process; there is deliberately no
  # scheduler and no second worker service.
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "worker"]
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dealpilot}:${POSTGRES_PASSWORD:-dealpilot}@postgres:5432/${POSTGRES_DB:-dealpilot}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dealpilot}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-dealpilot-documents}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      # Migrations run on backend start, so the worker must not query before
      # the schema exists.
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - dealpilot_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  dealpilot_postgres_data:
  dealpilot_minio_data:
  dealpilot_pgadmin_data:
  dealpilot_frontend_node_modules:
